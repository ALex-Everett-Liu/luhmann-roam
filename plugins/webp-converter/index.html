<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fas fa-image"></i> WebP Converter</h1>
            <p class="subtitle">Convert images to WebP format with quality control</p>
        </header>

        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <h3>Drop images here or click to upload</h3>
                    <p>Supports: JPG, PNG, GIF, BMP, TIFF, WebP</p>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-plus"></i> Select Images
                    </button>
                </div>
            </section>

            <!-- Settings Panel -->
            <section class="settings-panel">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label for="qualitySlider">Quality</label>
                        <div class="slider-container">
                            <input type="range" id="qualitySlider" min="1" max="100" value="80">
                            <span id="qualityValue">80</span>
                        </div>
                    </div>
                    
                    <div class="setting-group">
                        <label for="outputFormat">Output Format</label>
                        <select id="outputFormat">
                            <option value="webp">WebP</option>
                            <option value="jpeg">JPEG</option>
                            <option value="png">PNG</option>
                            <option value="avif">AVIF</option>
                            <option value="tiff">TIFF</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label for="outputDirectory">Output Directory</label>
                        <div class="directory-selector">
                            <input type="text" id="outputDirectory" placeholder="Leave empty for default output folder" readonly>
                            <button onclick="selectOutputDirectory()">
                                <i class="fas fa-folder"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Image Preview Section -->
            <section class="preview-section">
                <div class="section-header">
                    <h3><i class="fas fa-images"></i> Images to Convert</h3>
                    <button id="clearAllBtn" class="clear-btn" style="display: none;">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>
                <div id="imagePreview" class="image-grid">
                    <div class="empty-state">
                        <i class="fas fa-image"></i>
                        <p>No images selected</p>
                    </div>
                </div>
            </section>

            <!-- Conversion Results -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <div class="section-header">
                    <h3><i class="fas fa-check-circle"></i> Conversion Results</h3>
                    <button onclick="clearResults()" class="clear-btn">
                        <i class="fas fa-times"></i> Clear Results
                    </button>
                </div>
                <div id="conversionResults" class="results-grid">
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-section">
                <button id="convertBtn" class="convert-btn" disabled>
                    <i class="fas fa-magic"></i> Convert Images
                </button>
                <button id="stopBtn" class="stop-btn" style="display: none;">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </section>

            <!-- Progress Section -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Converting... 0%</div>
            </section>
        </main>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay" style="display: none;">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Processing...</p>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
