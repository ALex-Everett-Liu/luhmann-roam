<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luhmann-Roam</title>
  <!-- Add direct reference to your local font CSS -->
  <link rel="stylesheet" href="css/fonts/NotoSerifSC.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/settings-manager.css">
  <link rel="stylesheet" href="css/basic-font-settings.css">
  <link rel="stylesheet" href="css/webp-converter-plugin-modal.css">
  <link rel="stylesheet" href="css/image-viewer-plugin-modal.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <h1 id="app-title">Outliner</h1>
      <button id="add-root-node">Add Root Node</button>
      <button id="save-changes" class="save-button">Save Changes</button>
      <button id="discard-changes" class="discard-button">Discard Changes</button>
      <button id="backup-database" class="backup-button">Backup Database</button>
      <!-- Resize Handle -->
      <div id="resize-handle" class="resize-handle"></div>
    </div>
    <div class="content">
      <div id="outliner-container"></div>
    </div>
  </div>

  <!-- WebP Converter Plugin Modal -->
  <div id="webp-converter-plugin-modal" class="webp-converter-plugin-modal">
    <div class="webp-converter-plugin-header">
      <h3>WebP Converter</h3>
      <div class="webp-converter-plugin-controls">
        <button id="webp-converter-plugin-fullscreen" class="webp-converter-plugin-btn" title="Toggle Fullscreen">⛶</button>
        <button id="webp-converter-plugin-close" class="webp-converter-plugin-btn" title="Close">✕</button>
      </div>
    </div>
    <div class="webp-converter-plugin-content">
      <div id="webp-converter-plugin-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #666; z-index: 1; pointer-events: none;">Loading WebP Converter...</div>
      <iframe id="webp-converter-plugin-iframe" src="" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Image Viewer Plugin Modal -->
  <div id="image-viewer-plugin-modal" class="image-viewer-plugin-modal">
    <div class="image-viewer-plugin-header">
      <h3>Image Viewer</h3>
      <div class="image-viewer-plugin-controls">
        <button id="image-viewer-plugin-fullscreen" class="image-viewer-plugin-btn" title="Toggle Fullscreen">⛶</button>
        <button id="image-viewer-plugin-close" class="image-viewer-plugin-btn" title="Close">✕</button>
      </div>
    </div>
    <div class="image-viewer-plugin-content">
      <div id="image-viewer-plugin-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #666; z-index: 1; pointer-events: none;">Loading Image Viewer...</div>
      <iframe id="image-viewer-plugin-iframe" src="" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Load resizable sidebar -->
  <script src="js/resizableSidebar.js"></script>
  
  <!-- Load plugin registry (before settings manager) -->
  <script src="js/pluginRegistry.js"></script>
  
  <!-- Load settings manager -->
  <script src="js/settingsManager.js"></script>

  <!-- Then load other modules -->
  <!-- Link Manager removed - node operations sufficient -->
  <!-- FilterManager removed - search and breadcrumb managers sufficient -->
  <script src="js/breadcrumbManager.js"></script>
  <script src="js/positionManager.js"></script>
  <script src="js/nodeOperationsManager.js"></script>
  <script src="js/nodeExpansionManager.js"></script>
  <script src="js/nodeActionsManager.js"></script>
  <!-- timestampManager.js removed - will be redesigned later -->
  <script src="js/persistentTooltipManager.js"></script>
  <script src="js/basicFontSettings.js"></script>
  <script src="js/backupManager.js"></script>
  <!-- Database Export/Import Manager removed - replaced by backup functionality -->

  <!-- Add Cytoscape.js library and graph analysis -->
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <!-- Move D3.js BEFORE globalGraphManager.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>


  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- WebP Converter Plugin Launcher -->
  <script src="/plugins/webp-converter/webpConverterPluginLauncher.js"></script>
  
  <!-- Image Viewer Plugin Launcher -->
  <script src="/plugins/image-viewer/imageViewerPluginLauncher.js"></script>
</body>
</html>
