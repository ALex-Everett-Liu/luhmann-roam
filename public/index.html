<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luhmann-Roam</title>
  <!-- Add direct reference to your local font CSS -->
  <link rel="stylesheet" href="css/fonts/NotoSerifSC.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/settings-manager.css">
  <link rel="stylesheet" href="css/basic-font-settings.css">
  <link rel="stylesheet" href="css/graph-plugin-modal.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <h1 id="app-title">Outliner</h1>
      <button id="add-root-node">Add Root Node</button>
      <button id="save-changes" class="save-button">Save Changes</button>
      <button id="discard-changes" class="discard-button">Discard Changes</button>
      <button id="backup-database" class="backup-button">Backup Database</button>
      <!-- Resize Handle -->
      <div id="resize-handle" class="resize-handle"></div>
    </div>
    <div class="content">
      <div id="outliner-container"></div>
    </div>
  </div>

  <!-- Graph Plugin Modal -->
  <div id="graph-plugin-modal" class="graph-plugin-modal">
    <div class="graph-plugin-header">
      <h3>Graph Plugin</h3>
      <div class="graph-plugin-controls">
        <button id="graph-plugin-fullscreen" class="graph-plugin-btn" title="Toggle Fullscreen">⛶</button>
        <button id="graph-plugin-close" class="graph-plugin-btn" title="Close">✕</button>
      </div>
    </div>
    <div class="graph-plugin-content">
      <div id="graph-plugin-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #666; z-index: 1; pointer-events: none;">Loading Graph Plugin...</div>
      <iframe id="graph-plugin-iframe" src="" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Load resizable sidebar -->
  <script src="js/resizableSidebar.js"></script>
  
  <!-- Load plugin registry (before settings manager) -->
  <script src="js/pluginRegistry.js"></script>
  
  <!-- Load settings manager -->
  <script src="js/settingsManager.js"></script>

  <!-- Then load other modules -->
  <!-- Link Manager removed - node operations sufficient -->
  <!-- FilterManager removed - search and breadcrumb managers sufficient -->
  <script src="js/breadcrumbManager.js"></script>
  <script src="js/positionManager.js"></script>
  <script src="js/nodeOperationsManager.js"></script>
  <script src="js/nodeExpansionManager.js"></script>
  <!-- timestampManager.js removed - will be redesigned later -->
  <script src="js/persistentTooltipManager.js"></script>
  <script src="js/basicFontSettings.js"></script>
  <script src="js/backupManager.js"></script>
  <!-- Database Export/Import Manager removed - replaced by backup functionality -->

  <!-- Add Cytoscape.js library and graph analysis -->
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <!-- Move D3.js BEFORE globalGraphManager.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>


  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Graph Plugin Launcher -->
  <script src="js/graphPluginLauncher.js"></script>
</body>
</html>
